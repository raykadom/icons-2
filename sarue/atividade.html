<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONS</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./atividade.css">


</head>
<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
          <span class="navbar-text">
            BOOTSTRAP 
          </span>
        </div>
      </nav>




    <div class="card mb-3" style="max-width: 540px;">
        <div class="row g-0">
          <div class="col-md-4">
            <i class="bi bi-battery"></i>
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title">   Bateria Insuficiente</h5>
              <p class="card-text">Carregar imediatamente.</p>
            </div>
          </div>
        </div>
      </div>
    <div class="card mb-3" style="max-width: 540px;">
        <div class="row g-0">
          <div class="col-md-4">
          <i class="bi bi-battery-low"></i>
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title">Bateria Fraca</h5>
              <p class="card-text">Recomendado que carregue assim que possível.</p>
            </div>
          </div>
        </div>
      </div>
    <div class="card mb-3" style="max-width: 540px;">
        <div class="row g-0">
          <div class="col-md-4">
            <i class="bi bi-battery-full"></i>
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title">Bateria Carregada</h5>
              <p class="card-text">Bateria suficiente para o uso.</p>
            </div>
          </div>
        </div>
      </div>




</body>
</html>
